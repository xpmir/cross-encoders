id: train_mice_ettin150-l12+3
title: "Mice-Ettin-150m Training"
description:
    Base Training for Ettin-150m-based MICE model.

module: MICE.experiments.mice_training
# pre_experiment: pre_experiment

seed: 12 # To mimick the HF xp
nb_repetitions: 3
retriever: ""


preprocessing:
    requirements: duration=8h & cpu(cores=8)

indexation:
    requirements: duration=8h & cpu(cores=5) & cuda(mem=10G)

validation:
    # Use 500 topics for validation
    size: 500

# This set of hyperparameters follows: https://github.com/huggingface/sentence-transformers/blob/9f76b5790fa8f0175ccdc27e41f9ae348f557144/examples/training/ms_marco/train_cross-encoder-v2.py
learner:
    optimization:
        steps_per_epoch: 100
        batch_size: 32
        max_epochs: 2000 # Sum is 2_500_000. Multiplied by BS of 32, it gives 80M samples, which is a bit above the size of the dataset
        num_warmup_steps: 20000 # Follows the original setup
        weight_decay: 0.00
        lr: 1e-5
        eps: 1.0e-8
    # sample_max: 2_000_000
    max_grad_norm: 1.0
    loss: marginMSE
    checkpoint_interval: 100
    validation_interval: 50
    validation_top_k: 100
    validation: nanobeir11
    requirements: duration=15h & cpu(cores=16) & cuda(mem=40G)

retrieval:
    requirements: duration=20h & cpu(cores=16) & cuda(mem=30G) * 2
    k: 1000
    batch_size: 128

evaluation: #default = Minified tests
    all_datasets: false
    in_domain: true
    beir13: true

base: jhu-clsp/ettin-encoder-150m
max_length: 1024
n_contextualization_layers: 12 # 22 layers
n_interaction_layers: 3
mask_cls_to_doc: false
