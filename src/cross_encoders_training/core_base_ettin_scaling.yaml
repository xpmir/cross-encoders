parent: core_base # load configuration from core base.
id: core_base_ettin_scaling
title: "Scaling law for Ettin encoders"
description:
    we remove the infoNCE_rankdistill and use h100 for remaining fever evals..

seed: 12 # To mimick the HF xp
nb_repetitions: 3
max_length: 1024
normalize_docs_per_batch: true

### Overrides parameters from core_base
learner:
    fabric:
        precision: bf16-mixed

retrieval:
    requirements: duration=20h & cpu(cores=16) & cuda(mem=30G) * 2
    batch_size: 64
    k: 1000

evaluation:
    all_datasets: false
    in_domain: true
    beir13: true


#### Params that are grid searched
grid_search:

    base:
        values_list:
            - jhu-clsp/ettin-encoder-150m
            - jhu-clsp/ettin-encoder-400m
            # - jhu-clsp/ettin-encoder-1b

    learner.loss:
        values_list:
            - infoNCE_Colbertv2Neg
            - marginMSE
