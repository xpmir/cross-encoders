id: baseline_ettin32m_long
title: "Training Ettin-32m Reranker with MSE"
description:
    Configuration for training an ettin-32m model with the MSE_mixedbread_large loss on cross_encoder.ettin_reranker_v1_data.

module: cross_encoders_training.experiment
parent: ../_common.yaml
nb_repetitions: 2

# This set of hyperparameters follows https://huggingface.co/blog/ettin-reranker
learner:
    optimization:
        max_epochs: 3000 # 3k x 512 x 100 = 180M < 143M in dataset
        num_warmup_steps: 20000 # Follows the original setup
        # Values from Ettin Rerankers: https://huggingface.co/blog/ettin-reranker
        batch_size: 512
        lr: 1.2e-4
    requirements: duration=20h & cpu(cores=16, mem=10G) & cuda(mem=50G) * 2

# Subsets of the ettin-reranker-v1-data dataset to exclude (by default empty, using all 39 subsets)
scorer_type: stCrossEncoder
base: jhu-clsp/ettin-encoder-32m

#override _common.yaml
max_len: null

evaluation: #default = Minified tests
    all_datasets: false
    in_domain: true
    beir13: true
    eval_checkpoint:
        - last
        - 1500
