id: eval_scorer_top100_tok
title: cross_scorer_evaluation
description: Studies the impact of tokenization on the evaluation of cross-encoders, by using separate max_len for query and doc. This ensures parity with Mice models that tokenize query and doc separately.

module: Evaluation.experiment
pre_experiment: pre_experiment
parent: ../_common.yaml
gpu: true

retriever: naver/splade-v3-distilbert

scorer_type: st

grid_search:
  scorer_id:
    - cross-encoder/ettin-reranker-68m-v1
    # - cross-encoder/ettin-reranker-400m-v1
    # - cross-encoder/ettin-reranker-150m-v1
    # - cross-encoder/ettin-reranker-17m-v1
    # - Qwen/Qwen3-Reranker-0.6B
    # - cross-encoder/ms-marco-MiniLM-L12-v2
    # - mixedbread-ai/mxbai-rerank-base-v2
    # - xpmir/cross-encoder-MiniLM-L12-infoNCE
    # - mixedbread-ai/mxbai-rerank-large-v2

max_length: null #independent max_query / doc lens
max_query_length: 32
max_doc_length: 512

evaluation:
  #just for debugging
  in_domain: true
  beir13: true
  # beir13_decontaminated: true
