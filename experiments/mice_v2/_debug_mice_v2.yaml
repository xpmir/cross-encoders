id: debug_mice_v2_training
title: "Debugging Mice V2 training"
description:
    💡 Debug config for ModernBERT Mice V2 training using ettin-encoder-17m

module: MICE.experiments.micev2_training
export_trained_models: false
parent: ./_ettin68m.yaml


nb_repetitions: 2

# Shared Training hyperparameters for all the Mini Mice Models
learner:
    loss: MSE_mixedbread_large
    optimization:
        steps_per_epoch: 100
        max_epochs: 150 #  x 128 x 100 = ~26M Samples < 145M in full dataset
        batch_size: 256 #is 256 in ettin-reranker-v1
    fabric:
        precision: bf16-mixed
    # sample_max: 2_000_000
    checkpoint_interval: 50
    validation_interval: 5
    requirements: duration=2h & cpu(cores=16) & cuda(mem=80G)

retrieval:
    #fast evals don't need multiple GPUs
    # requirements: duration=20h & cpu(cores=16) & cuda(mem=30G) * 2
    requirements: duration=2h & cpu(cores=8) & cuda(mem=50G) # debug on H100

evaluation:
    fabric:
        precision: bf16-mixed
    all_datasets: false
    in_domain: true
    datasets:
        - nfcorpus
        - scifact

# Test Utility Soft Gating & Phase 2 Hard Token Pruning
utility_pred: true
lambda_reg:
    values_list:
        - 1e-2
        - 1e-1
        # - 1e-3

phase2_training: true
hard_prune_threshold: 0.5
phase2_max_epochs: 200
