description:
    Smaller variant of the base ettin 68 xp, allowing to validate architectural choices before full scale training.
parent: ../_ettin68m.yaml

# This set of hyperparameters follows https://huggingface.co/blog/ettin-reranker
learner:
    optimization:
        max_epochs: 3000 #  x 256 x 100 = ??M Samples < 145M in full dataset
        # 2k epochs is arnoud 4h training with 2 * H100 80G
        num_warmup_steps: 20000
    checkpoint_interval: 100
    validation_interval: 25


evaluation: #default = Minified tests
    eval_checkpoint: "last"
    all_datasets: false
    in_domain: false
    beir13: true
