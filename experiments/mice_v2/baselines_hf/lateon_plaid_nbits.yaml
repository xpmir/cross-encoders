id: eval_lateon_plaid_abl_nbits
title: lateon_plaid_retrieval_evaluation
description: Evaluate LateOn on Various nbits

parent: ../_common.yaml
module: Evaluation.experiment
pre_experiment: pre_experiment

use_plaid: true
include_recall_100: true


plaid:
  max_doc_length: 512
  max_query_length: 32
  n_bits: 2
  kmeans_niters: 4
  n_ivf_probe: 8
  buffer_size: 1000
  fast_plaid_batch_size: 25000

retrieval:
  k: 100
  requirements: duration=4h & cpu(cores=4, mem=16G) & cuda(mem=30G)

indexation:
  batch_size: 32
  requirements: duration=4h & cpu(cores=4, mem=20G) & cuda(mem=30G)

evaluation:
  in_domain: false
  beir13: false
  datasets:
    - scidocs
    - scifact
    - arguana
    # - nfcorpus
    # - fiqa
    # - trec_covid

retriever: naver/splade-v3-distilbert

grid_search:
  plaid.n_bits: [2, 4, 8]
  config_dicts:
    - scorer_type: stMultiVectorEncoder
      scorer_id: lightonai/LateOn
    - scorer_type: miceV2
      scorer_id: train_micev2_ettin68m_l10+4_v3_plaid_128
