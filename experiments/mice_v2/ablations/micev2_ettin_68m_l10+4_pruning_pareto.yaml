id: train_micev2_ettin68m_l10+4_abl_pruning_pareto
title: "Mice-Ettin-68m Bottom LayerNorm Ablation"
description:
    Keeps the best choices from budget and schedule, and find the pareto optimal regularization for pruning


module: MICE.experiments.micev2_training
parent: ../_ettin68m_abl.yaml
nb_repetitions: 2
export_trained_models: false

# This set of hyperparameters follows https://huggingface.co/blog/ettin-reranker
learner:
    optimization:
        max_epochs: 2000 #  x 256 x 100 = ??M Samples < 145M in full dataset

    requirements: duration=10h & cpu(cores=16) & cuda(mem=80G)*2 # H100


top_layers_doc_ln: true
bottom_final_norm: false
normalize_doc_embeds: true

# Test Utility Soft Gating & Phase 2 Hard Token Pruning
utility_pred: true
hard_prune_threshold: 0.1
phase2_training: true
phase2_max_epochs: 1000
eval_phase_1: false


# Eval only on BEIR
eval_sparsity: true
evaluation: #default = Minified tests
    eval_checkpoint: "last"
    all_datasets: false
    in_domain: false
    beir13: false

#best values from v1
lambda_reg: 5e-1
reg_target: u
temp_start: 1.0
l2_reg: false

grid_search:
    config_dicts:
        - {lambda_reg: 5e-1, temp_end: null, temp_schedule: linear, utility_bias: 5.0} # baseline -> degenerates

        # Anneal temperature: linear vs cosine vs exp (temp_end: 1e-1)
        - {lambda_reg: 0.3, temp_end: 0.1, temp_schedule: exp, utility_bias: 5.0}
        - {lambda_reg: 0.5, temp_end: 0.1, temp_schedule: exp, utility_bias: 5.0}
        - {lambda_reg: 0.7, temp_end: 0.1, temp_schedule: exp, utility_bias: 5.0}
        - {lambda_reg: 1.0, temp_end: 0.1, temp_schedule: exp, utility_bias: 5.0}
        - {lambda_reg: 1.5, temp_end: 0.1, temp_schedule: exp, utility_bias: 5.0}

        #Test pushing the frontier up
        - {lambda_reg: 1.0, temp_end: 0.01, temp_schedule: exp, utility_bias: 5.0} # -- not learned
        - {lambda_reg: 1.0, temp_end: 0.01, temp_schedule: exp, utility_bias: 1.0} # try lower utility bias to see if it learns better
        - {lambda_reg: 1.0, temp_end: 0.01, temp_schedule: cosine, utility_bias: 1.0} # cosine schedule, lower utility bias

        #Test pushing the frontier down
        - {lambda_reg: 0.1, temp_end: 0.1, temp_schedule: exp, utility_bias: 5.0} # -- too weak, not learned
        - {lambda_reg: 0.1, temp_end: 0.1, temp_schedule: exp, utility_bias: 1.0} #
        - {lambda_reg: 0.1, temp_end: 0.1, temp_schedule: exp, utility_bias: 0.0} # too low even if don't degenerate, not learned
        - {lambda_reg: 0.1, temp_end: 0.01, temp_schedule: cosine, utility_bias: 1.0} #
        - {lambda_reg: 0.1, temp_end: 0.1, temp_schedule: cosine, utility_bias: 1.0} #
        - {lambda_reg: 0.1, temp_end: 0.1, temp_schedule: cosine, utility_bias: 3.0} #
        - {lambda_reg: 0.1, temp_end: 0.1, temp_schedule: exp, utility_bias: 3.0} #

        # benchmarking the effect of scheduling
        - {lambda_reg: 0.3, temp_end: 0.1, temp_schedule: cosine, utility_bias: 1.0} # cosine schedule, lower utility bias
        - {lambda_reg: 0.3, temp_end: 0.1, temp_schedule: exp, utility_bias: 1.0} # cosine schedule, lower utility bias
        - {lambda_reg: 0.3, temp_end: 0.1, temp_schedule: linear, utility_bias: 1.0} # cosine schedule, lower utility bias
