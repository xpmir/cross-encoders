id: train_micev2_ettin68m_l10+4_pruned
title: "Mice-Ettin-68m Training"
description:
    Base Training for Ettin-68m-based MICE model.

module: MICE.experiments.micev2_training
parent: ./_ettin68m.yaml
nb_repetitions: 2

learner:
    optimization:
        max_epochs: 3000 # 6k x 256 x 100 = ~150M Samples ~ 145M in full dataset

evaluation: #default = Minified tests
    eval_checkpoint: "last"
    all_datasets: false
    in_domain: true
    beir13: true

# Exceptionally use H100 for eval
# retrieval:
#     requirements: duration=1h & cpu(cores=16) & cuda(mem=40G)

# Test Utility Soft Gating & Phase 2 Hard Token Pruning
utility_pred: true
lambda_reg:
    values_list:
        - 1e-1
        - 2e-1
        - 5e-1

phase2_training: true
hard_prune_threshold: 0.1
phase2_max_epochs: 3000
eval_phase_1: true

#override just for this experiment so spare compute (doesn't change much)
max_length: 1024
max_query_length: null
max_doc_length: null
