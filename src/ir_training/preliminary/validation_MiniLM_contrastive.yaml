id: validation_minilm_contrastive
title: "Validation comparison experiment for MiniLM"
description: 
    Using the best parameters from the grid search for MiniLM
    we run additional trainings validating on nanobeir to see the impact on OOD.

module: ir_training.experiment

seed: 12 # To mimick the HF xp 
nb_repetitions: 3

retriever: "naver/splade-v3-distilbert" 
base: microsoft/MiniLM-L12-H384-uncased

preprocessing:
    requirements: duration=8h & cpu(cores=8)

indexation:
    requirements: duration=8h & cpu(cores=5) & cuda(mem=10G)

validation:
    # Use 500 topics for validation
    size: 500

# This set of hyperparameters follows: https://github.com/huggingface/sentence-transformers/blob/9f76b5790fa8f0175ccdc27e41f9ae348f557144/examples/training/ms_marco/train_cross-encoder-v2.py
learner:
    optimization:
        steps_per_epoch: 100
        batch_size: 64
        max_epochs: 2000 # Sum is 2_500_000. Multiplied by BS of 32, it gives 80M samples, which is a bit above the size of the dataset
        num_warmup_steps: 5000 # Follows the original setup
        weight_decay: 0.00
        lr: 7e-6
        eps: 1.0e-8
    # sample_max: 2_000_000
    max_grad_norm: 1.0
    checkpoint_interval: 100
    validation_interval: 50
    validation_top_k: 100
    validation: all
    loss: bce
    requirements: duration=20h & cpu(cores=16) & cuda(mem=40G)


retrieval:
    requirements: duration=20h & cpu(cores=16) & cuda(mem=30G)
    k: 1000


evaluation:
    all_datasets: false
    in_domain_only: false
