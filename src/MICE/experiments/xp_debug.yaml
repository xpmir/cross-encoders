id: debug_mice_training
title: "Debugging Mice training"
parent: mice_MiniLM_l4.yaml
description:
    💡 this config load everything from core_base.yaml, and just overrides the base and learner.loss
    So that only ettin-150m is launched with infoNCE loss

module: MICE.experiments.mice_training
pre_experiment: pre_experiment
export_trained_models: false

seed: 12 # To mimick the HF xp
nb_repetitions: 1


preprocessing:
    requirements: duration=8h & cpu(cores=8)

indexation:
    batch_size: 128
    requirements: duration=20h & cpu(cores=4, mem=10G) & cuda(mem=40G)

validation:
    # Use 500 topics for validation
    size: 500

base:
    - microsoft/MiniLM-L12-H384-uncased
    - google/electra-base-discriminator

evaluation:
    # test_max_topics: 100
    all_datasets: false
    in_domain: false
    datasets:
        - arguana
        - nfcorpus
        # - fiqa

