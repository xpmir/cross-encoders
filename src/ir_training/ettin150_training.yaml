parent: ../paper/core_base # 
id: core_base_ettin150
title: "Ettin-150-InfoNCE Training"
description: 
    💡 this config load everything from core_base.yaml, and just overrides the base and learner.loss 
    So that only ettin-150m is launched with infoNCE loss 

# All the following Overrides parameters from core_base

### We only launch one training (5 in the paper for fair comparison)
nb_repetitions: 1

## We don't use all datasets for evaluation, only those defined in tests.minified_tests 
### You need acess to LoTTe and Robust to run all evals.
evaluation:
    all_datasets: false

#### Params that are grid searched 
grid_search:

    base: 
        values_list: 
            - jhu-clsp/ettin-encoder-150m

    learner.loss:
        values_list:
            - infoNCE_RankDistiLLM