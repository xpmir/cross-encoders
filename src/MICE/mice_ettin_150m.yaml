id: train_mice_ettin_150m
title: "Mice-Ettin-150m Training"
description:
    Base Training for Ettin-150m-based MICE model.

module: MICE.mice_training
pre_experiment: pre_experiment

seed: 12 # To mimick the HF xp
nb_repetitions: 2
retriever: ""


preprocessing:
    requirements: duration=8h & cpu(cores=8)

indexation:
    requirements: duration=8h & cpu(cores=5) & cuda(mem=10G)

validation:
    # Use 500 topics for validation
    size: 500

# This set of hyperparameters follows: https://github.com/huggingface/sentence-transformers/blob/9f76b5790fa8f0175ccdc27e41f9ae348f557144/examples/training/ms_marco/train_cross-encoder-v2.py
learner:
    optimization:
        steps_per_epoch: 100
        batch_size: 32
        max_epochs: 2500 # Sum is 2_500_000. Multiplied by BS of 32, it gives 80M samples, which is a bit above the size of the dataset
        num_warmup_steps: 5000 # Follows the original setup
        weight_decay: 0.00
        lr: 1e-5
        eps: 1.0e-8
    # sample_max: 2_000_000
    max_grad_norm: 1.0
    checkpoint_interval: 100
    validation_interval: 50
    validation_top_k: 100
    validation: nanobeir11
    requirements: duration=12h & cpu(cores=16) & cuda(mem=80G)

retrieval:
    requirements: duration=20h & cpu(cores=16) & cuda(mem=30G)
    k: 1000
    batch_size: 128

# evaluation: #default = Minified tests
#     all_datasets: false
#     in_domain: true

base: jhu-clsp/ettin-encoder-150m
n_contextualization_layers: 6
n_interaction_layers: 3
mask_cls_to_doc: false

#### Params that are grid searched
grid_search:
    learner.loss:
        values_list:
            - marginMSE
