[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-encoders"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "experimaestro-ir[anserini,neural]",
    "experimaestro>=2.1.0",
    "ir-datasets",
    "pandas>=3.0.0",
    "tabulate>=0.9.0",
    "transformers>=5.0.0",
    "xpm-torch",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.mypy]
plugins = ["experimaestro.mypy"]

[tool.uv.sources]
experimaestro = { path = "experimaestro-python", editable = true }
experimaestro-ir = { path = "experimaestro-ir", editable = true }
ir-datasets = { git = "https://github.com/bpiwowar/ir_datasets.git" }

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "notebook>=7.5.4",
]

