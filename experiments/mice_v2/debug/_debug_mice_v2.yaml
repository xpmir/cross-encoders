id: debug_mice_v2_training
title: "Debugging Mice V2 training"
description:
    💡 Debug config for ModernBERT Mice V2 training using ettin-encoder-17m

module: MICE.experiments.micev2_training
parent: ../_ettin68m.yaml
nb_repetitions: 1

base: cross-encoder/ettin-reranker-68m-v1
from_experiment: train_micev2_ettin68m_l10+4_v3

learner:
    optimization:
        max_epochs: 1000 # 5k x 256 x 100 = 128M < 143M in dataset
        lr: 7e-5
        re_no_l2_regularization: ['\.bias$', '(?i)norm' ]
    requirements: duration=2h & cpu(cores=16, mem=10G) & cuda(mem=50G) * 2

evaluation: #default = Minified tests
    eval_checkpoint: "last"
    all_datasets: false
    in_domain: true
    beir13: true

freeze_top_layers: False
