id: train_micev2_ettin68m_l10+4_v3_compress
title: "Mice-Ettin-68m Training with Compression"
description:
    Ettin-68m-based MICE model initialized from train_micev2_ettin68m_l10+4_v3 checkpoint,
    training for 5000 epochs with compression ratios 1.0 and 1.3333.

module: MICE.experiments.micev2_training
parent: ./_ettin68m.yaml
nb_repetitions: 2

base: cross-encoder/ettin-reranker-68m-v1
from_experiment: train_micev2_ettin68m_l10+4_v3
query_prompt: "[Q] "
doc_prompt: "[D] "

learner:
    optimization:
        max_epochs: 5000 # 5k x 256 x 100 = 128M < 143M in dataset
        lr: 7e-5
        re_no_l2_regularization: ['\.bias$', '(?i)norm' ]

evaluation: #default = Minified tests
    eval_checkpoint: "last"
    all_datasets: false
    in_domain: true
    beir13: true


grid_search:
    config_dicts:
        - {compress_dim: 4, compress_init_option: "random", freeze_bottom_layers_phase1: true}
        - {compress_dim: 2, compress_init_option: "random", freeze_bottom_layers_phase1: true}
        - {compress_dim: 1.333333333, compress_init_option: "random", freeze_bottom_layers_phase1: true}
        - {compress_dim: 1.333333333, compress_init_option: "seed", freeze_bottom_layers_phase1: false}
        - {compress_dim: 1.0, compress_init_option: "seed", freeze_bottom_layers_phase1: false}
        - {compress_dim: 1.0, compress_init_option: "random", freeze_bottom_layers_phase1: true}
