parent: core_mini # load configuration from core base.
id: core_mini_debug
title: "Validation comparison experiment"
description:
    Compare initial experiment with new version of code (should be faster)

seed: 12 # To mimick the HF xp
nb_repetitions: 1

### Overrides parameters from core_base
base: jhu-clsp/ettin-encoder-32m

# This set of hyperparameters follows: https://github.com/huggingface/sentence-transformers/blob/9f76b5790fa8f0175ccdc27e41f9ae348f557144/examples/training/ms_marco/train_cross-encoder-v2.py
learner:
    optimization:
        max_epochs: 1000 # Sum
    loss: marginMSE
    validation: msmarco
    requirements: duration=30h & cpu(cores=4) & cuda(mem=16G)

retrieval:
    # Use H100 for faster evals..
    requirements: duration=30h & cpu(cores=4) & cuda(mem=16G)
    k: 1000

evaluation:
    in_domain: true


#### Empty grid search overriding core_mini

#### Params that are grid searched
grid_search:
    base:
        values_list:
            - jhu-clsp/ettin-encoder-32m

    learner.loss:
        values_list:
            - marginMSE

    learner.fabric.precision:
        values_list:
            - bf16-mixed
