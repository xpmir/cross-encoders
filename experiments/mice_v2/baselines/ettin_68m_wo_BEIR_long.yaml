id: baseline_ettin68_wo_BEIR_long
title: "Training Ettin-68m Reranker with MSE"
description:
    Comparing results of ettin68m MSE baseline when omitting BEIR data from the training set.

module: cross_encoders_training.experiment
parent: ./ettin_68m_wo_BEIR.yaml
# pre_experiment: pre_experiment
nb_repetitions: 2

evaluation:
    eval_last_checkpoint: true


# This set of hyperparameters follows: https://github.com/huggingface/sentence-transformers/blob/9f76b5790fa8f0175ccdc27e41f9ae348f557144/examples/training/ms_marco/train_cross-encoder-v2.py
learner:
    loss: MSE_mixedbread_large
    optimization:
        steps_per_epoch: 100
        batch_size: 256
        max_epochs: 5000 #  x 256 x 100 = ~128M Samples < 145M in full dataset
        num_warmup_steps: 40000 # Fo
    requirements: duration=20h & cpu(cores=16, mem=10G) & cuda(mem=80G) * 2
