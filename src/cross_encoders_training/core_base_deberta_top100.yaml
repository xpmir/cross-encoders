id: core_base_deberta_top100
parent: core_base # load configuration from core base.
title: "Training Deberta Reranker"
description:
    Example configuration for training an ettin-150m model with two different losses.

seed: 12 # To mimick the HF xp
nb_repetitions: 3

### Overrides parameters from core_base
learner:
    fabric:
        precision: bf16-mixed

max_doc_len: 1024

normalize_docs_per_batch: true

retrieval:
    requirements: duration=20h & cpu(cores=16) & cuda(mem=30G)
    batch_size: 128
    k: 1000

evaluation:
    all_datasets: true
    in_domain: true


#### Params that are grid searched
grid_search:
    base:
        values_list:
            - microsoft/deberta-v3-base

    retrieval.k:
        values_list:
            - 1000
            - 100

    learner.loss:
        values_list:
            - marginMSE
            - infoNCE_RankDistiLLM
