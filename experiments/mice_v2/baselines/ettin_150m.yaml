id: baseline_ettin150m_long
title: "Training Ettin-150m Reranker with MSE"
description:
    Configuration for training an ettin-150m model with the MSE_mixedbread_large loss on cross_encoder.ettin_reranker_v1_data.

module: cross_encoders_training.experiment
parent: ../_common.yaml
nb_repetitions: 2

# This set of hyperparameters follows https://huggingface.co/blog/ettin-reranker
learner:
    optimization:
        max_epochs: 7000 # 7k x 192 x 100 = 134M < 143M in dataset
        num_warmup_steps: 20000 # Follows the original setup
        # Values from Ettin Rerankers: https://huggingface.co/blog/ettin-reranker
        batch_size: 192
        lr: 1.5e-5
    requirements: duration=20h & cpu(cores=16, mem=10G) & cuda(mem=50G) * 2

# Subsets of the ettin-reranker-v1-data dataset to exclude (by default empty, using all 39 subsets)
use_st_scorer: true # Use HFCrossScorer instead of STCrossEncoder
base: jhu-clsp/ettin-encoder-150m

#override _common.yaml
max_len: null

evaluation: #default = Minified tests
    all_datasets: false
    in_domain: true
    beir13: true
    eval_checkpoint:
        - last
