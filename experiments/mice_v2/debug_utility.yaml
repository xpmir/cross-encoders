id: debug_mice_v2_utility
title: "Debugging Mice V2 training"
description:
    💡 Debug config for ModernBERT Mice V2 training using ettin-encoder-17m

module: MICE.experiments.micev2_training
export_trained_models: false
parent: ./_debug_mice_v2.yaml


nb_repetitions: 2

retrieval:
    #fast evals don't need multiple GPUs
    # requirements: duration=20h & cpu(cores=16) & cuda(mem=30G) * 2
    requirements: duration=2h & cpu(cores=8) & cuda(mem=50G) # debug on H100
    long_requirements: duration=2h & cpu(cores=16) & cuda(mem=80G) * 2

evaluation:
    fabric:
        precision: bf16-mixed
    all_datasets: false
    in_domain: true
    datasets:
        - nfcorpus
        - scifact

# Test Utility Soft Gating & Phase 2 Hard Token Pruning
utility_pred: true
lambda_reg:
    values_list:
        - 1e-2
        - 1e-1
        # - 1e-3

phase2_training: true
hard_prune_threshold: 0.5
phase2_max_epochs: 200
