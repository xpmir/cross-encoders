id: eval_scorer_top100
title: cross_scorer_evaluation
description: Experiment whose purpose is to evaluate HF Cross-scorers

module: Evaluation.experiment
pre_experiment: pre_experiment

gpu: true

scorer_type: st
max_length: 1024

grid_search:
  scorer_id:
    - cross-encoder/ettin-reranker-17m-v1
    - cross-encoder/ettin-reranker-32m-v1
    - cross-encoder/ettin-reranker-68m-v1
    - cross-encoder/ettin-reranker-150m-v1
    # - cross-encoder/ettin-reranker-400m-v1

retrievers_hf_id:
  - naver/splade-v3-distilbert

indexation:
  requirements: duration=8h & cpu(cores=4, mem=10G) & cuda(mem=30G)
  sparse2bmp_requirements: duration=8h & cpu(cores=8)
  batch_size: 128

retrieval:
  requirements: duration=19h & cpu(cores=4, mem=10G) & cuda(mem=20G) * 2
  batch_size: 64
  k: 100

evaluation:
  #just for debugging
  in_domain: true
  beir13: true
