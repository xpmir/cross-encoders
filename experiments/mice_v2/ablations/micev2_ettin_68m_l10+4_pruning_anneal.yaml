id: train_micev2_ettin68m_l10+4_abl_pruning_anneal
title: "Mice-Ettin-68m Bottom LayerNorm Ablation"
description:
    Ablation comparing applying vs skipping LayerNorm at the output of bottom contextualization layers.

module: MICE.experiments.micev2_training
parent: ../_ettin68m_abl.yaml
nb_repetitions: 2
export_trained_models: false

# This set of hyperparameters follows https://huggingface.co/blog/ettin-reranker
learner:
    optimization:
        max_epochs: 2000 #  x 256 x 100 = ??M Samples < 145M in full dataset

    requirements: duration=10h & cpu(cores=16) & cuda(mem=80G)*2 # H100


top_layers_doc_ln: true
bottom_final_norm: false

# Test Utility Soft Gating & Phase 2 Hard Token Pruning
utility_pred: true
hard_prune_threshold: 0.1
phase2_training: true
phase2_max_epochs: 1000
eval_phase_1: false


# Eval only on BEIR
evaluation: #default = Minified tests
    eval_checkpoint: "last"
    all_datasets: false
    in_domain: true
    beir13: false


#best values from v1
lambda_reg: 5e-1
normalize_doc_embeds: true
reg_target: u
temp_start: 1.0
temp_schedule: linear

# reg_budget:
#     values_list: [null, 0.2]
# l2_reg:
#     values_list: [false, true]

grid_search:
    config_dicts:
        - {reg_budget: null, l2_reg: false, lambda_reg: 5e-1, temp_end: null, temp_schedule: linear} # baseline -> degenerates

        # Anneal temperature: linear vs cosine vs exp (temp_end: 1e-1)
        - {reg_budget: null, l2_reg: false, lambda_reg: 5e-1, temp_end: 1e-1, temp_schedule: linear}
        # Anneal temperature: linear vs cosine vs exp (temp_end: 1e-3)
        - {reg_budget: null, l2_reg: false, lambda_reg: 5e-1, temp_end: 1e-3, temp_schedule: linear}
        - {reg_budget: null, l2_reg: false, lambda_reg: 5e-1, temp_end: 1e-3, temp_schedule: cosine}
        - {reg_budget: null, l2_reg: false, lambda_reg: 5e-1, temp_end: 1e-3, temp_schedule: exp}

        # L2 reg baselines
        - {reg_budget: null, l2_reg: true, lambda_reg: 5e-1, temp_end: null, temp_schedule: linear} # l2 reg
        - {reg_budget: null, l2_reg: true, lambda_reg: 1.0, temp_end: null, temp_schedule: linear}

        # Combine annealing (schedules) and l2
        - {reg_budget: null, l2_reg: true, lambda_reg: 1.0, temp_end: 1e-3, temp_schedule: linear}
        - {reg_budget: null, l2_reg: true, lambda_reg: 1.0, temp_end: 1e-3, temp_schedule: cosine}
        - {reg_budget: null, l2_reg: true, lambda_reg: 1.0, temp_end: 1e-3, temp_schedule: exp}
        - {reg_budget: null, l2_reg: true, lambda_reg: 1.0, temp_end: 1e-1, temp_schedule: linear}

        #example of Budget reg
        - {reg_budget: 0.2, l2_reg: true, lambda_reg: 1e-0, temp_end: null, temp_schedule: linear}
