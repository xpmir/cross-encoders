id: train_micev2_ettin400m_l12+4_v3
title: "Mice-Ettin-400m Training"
description:
    Long Training for Mice-l12+4
parent: ./_common_mice_v3.yaml

pre_experiment: "" #uncomment to save model
export_trained_models: true #by default, override to save best model among seeds / configs: ready for HF export

# This set of hyperparameters follows https://huggingface.co/blog/ettin-reranker
learner:
    optimization:
        max_epochs: 6000 # 3k x 256 x 100 = 77M < 143M in dataset
        num_warmup_steps: 20000 # Follows the original setup
        # Values from Ettin Rerankers: https://huggingface.co/blog/ettin-reranker
        lr: 7e-6
        batch_size: 256
    requirements: duration=20h & cpu(cores=16, mem=10G) & cuda(mem=50G) * 4

base: cross-encoder/ettin-reranker-400m-v1
n_contextualization_layers: 18
n_interaction_layers: 4

evaluation: #default = Minified tests
    eval_checkpoint: "last"
    all_datasets: false
    in_domain: true
    beir13: true
    beir13_decontaminated: true

grid_search:
    learner.optimization.lr:
                        - 7e-6 # value for ettin rerankers
                        - 1e-5
