id: debug_colbert_ettin68m_l10+4
title: "Mice-Ettin-68m Training + ColBERT first-stage evaluation"
description:
    Reuses the same trained Mice-Ettin-68m models and PLAID indexes as
    _debug_plaid.yaml, and additionally evaluates a genuine ColBERT-style
    (MaxSim/IVF) first-stage retriever built from MICE's own bottom-layer
    contextualized embeddings, both standalone and reranked by MICE's top
    interaction layers.

module: MICE.experiments.micev2_training
parent: _debug_plaid.yaml

normalize_doc_embeds: true

plaid:
    use_colbert_first_stage: true
    buffer_size: 1000
    n_bits: 4

evaluation:
    include_recall_100: true
