id: core_mini_debug
title: "Hacienda version of core mini for debugging"
description:
    Using the best parameters from the grid search,
    we run additional trainings validating on nanobeir to see the impact on OOD.

module: cross_encoders_training.experiment
# pre_experiment: pre_experiment

seed: 12 # To mimick the HF xp
nb_repetitions: 1

retriever: "naver/splade-v3-distilbert"

preprocessing:
    requirements: duration=8h & cpu(cores=8)

indexation:
    requirements: duration=8h & cpu(cores=5) & cuda(mem=10G)

validation:
    # Use 500 topics for validation
    size: 500

# This set of hyperparameters follows: https://github.com/huggingface/sentence-transformers/blob/9f76b5790fa8f0175ccdc27e41f9ae348f557144/examples/training/ms_marco/train_cross-encoder-v2.py
learner:
    optimization:
        ### PUT HERE BEST HYPERPARAMS FROM PREVIOUS STEPS ###
        steps_per_epoch: 100
        batch_size: 32
        max_epochs: 100 # Sum is 2_500_000. Multiplied by BS of 32, it gives 80M samples, which is a bit above the size of the dataset
        num_warmup_steps: 5000 # Follows the original setup
        weight_decay: 0.00
        lr: 7e-6
        eps: 1.0e-8
    # sample_max: 2_000_000
    max_grad_norm: 1.0
    checkpoint_interval: 100
    validation_interval: 25
    validation_top_k: 100
    validation: nanobeir ### PUT HERE BEST VALIDATION FROM PREVIOUS STEPS ###
    requirements: duration=20h & cpu(cores=4) & cuda(mem=30G)

retrieval:
    requirements: duration=20h & cpu(cores=4) & cuda(mem=30G)
    k: 1000

evaluation:
    all_datasets: false

#### Params that are grid searched
grid_search:
    base:
        values_list:
            # - microsoft/MiniLM-L12-H384-uncased
            - jhu-clsp/ettin-encoder-17m
            # - jhu-clsp/ettin-encoder-32m
            # - jhu-clsp/ettin-encoder-68m
            - FacebookAI/roberta-base
            - google/electra-base-discriminator
            # - microsoft/deberta-v3-base
            # - jhu-clsp/ettin-encoder-150m

    learner.loss:
        values_list:
            - bce
            # - infoNCE
            # - hingeLoss
            # - marginMSE
            # - infoNCE_Colbertv2Neg
            # - distillRankNET
            # - ADR_MSE
