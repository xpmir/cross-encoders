id: eval_lateon_plaid_index_speed
title: lateon_plaid_retrieval_evaluation
description: Evaluation of LateOn multi-vector models with PLAID indexing and retrieval
  Benchmark of PLAID indexing speed across buffer and fast_plaid_batch_size variants
  This config aims at finding the optimal parameters to build the plaid index in reasonable time

parent: ../_common.yaml
module: Evaluation.experiment
pre_experiment: pre_experiment

use_plaid: true
include_recall_100: true

max_query_length: 32
max_doc_length: 512

scorer_id: lightonai/LateOn
scorer_type: stMultiVectorEncoder

plaid:
  max_doc_length: 512
  max_query_length: 32
  n_bits: 2
  kmeans_niters: 4
  n_ivf_probe: 8
  buffer_size: 1000
  fast_plaid_batch_size: 25000

retrieval:
  k: 100
  requirements: duration=4h & cpu(cores=8, mem=16G) & cuda(mem=30G)

indexation:
  batch_size: 32
  requirements: duration=2h & cpu(cores=8, mem=20G) & cuda(mem=30G)

evaluation:
  in_domain: false
  beir13: false
  beir13_decontaminated: false
  datasets:
    - touche
    # - scidocs
    # - nfcorpus
    # - arguana

grid_search:
  config_dicts:
    # 1. Baseline: Slow Rust chunking (1k buffer, 32 Fast-PLAID token chunk)
    - plaid.buffer_size: 5000
      plaid.fast_plaid_batch_size: 25000
      indexation.batch_size: 512

    # 2. Fast-PLAID Chunk Speedup: 25k token chunk at 1k buffer (tests pure Rust chunking speedup)
    - plaid.buffer_size: 5000
      plaid.fast_plaid_batch_size: 10000
      indexation.batch_size: 256

    # 3. Buffer Size Speedup: 5k buffer at 25k chunk
    - plaid.buffer_size: 10000
      plaid.fast_plaid_batch_size: 25000
      indexation.batch_size: 512
