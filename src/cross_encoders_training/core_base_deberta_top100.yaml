id: core_base_deberta_top100
parent: core_base_deberta # load configuration from core base.
title: "Training Deberta Reranker"
description:
    Compare results using top 100 vs 1000 documents from 1st stage (splade-v3)

retrieval:
    requirements: duration=20h & cpu(cores=16) & cuda(mem=30G)
    batch_size: 256
    k: 1000


evaluation:
    all_datasets: false
    in_domain: true
    beir13: true
    robust04: true
    # lotte_search: true
    # nanobeir: true


#### Params that are grid searched
grid_search:
    base:
        values_list:
            - microsoft/deberta-v3-base

    retrieval.k:
        values_list:
            - 1000
            - 100

    learner.loss:
        values_list:
            - marginMSE
            - infoNCE_RankDistiLLM
