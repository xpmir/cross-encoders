id: eval_lateon_plaid_retrieval
title: lateon_plaid_retrieval_evaluation
description: Evaluation of LateOn multi-vector models with PLAID indexing and retrieval

parent: ../_common.yaml
module: Evaluation.experiment
pre_experiment: pre_experiment

use_plaid: true
retrievers_only: false
include_recall_100: true

retrievers_hf_id:
  - lightonai/LateOn
  # - lightonai/LateOn-unsupervised


plaid:
  max_doc_length: 512
  max_query_length: 32
  n_bits: 2
  kmeans_niters: 4
  n_ivf_probe: 8
  buffer_size: 1000
  batch_size: 32

retrieval:
  k: 100
  requirements: duration=2h & cpu(cores=4, mem=16G) & cuda(mem=30G)

indexation:
  batch_size: 32
  requirements: duration=2h & cpu(cores=4, mem=20G) & cuda(mem=30G)

evaluation:
  in_domain: false
  beir13: false
  datasets:
    - scidocs
    - nfcorpus
    - scifact
    - arguana
