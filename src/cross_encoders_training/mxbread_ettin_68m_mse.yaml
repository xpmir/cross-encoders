id: baseline_ettin_68m_mse
title: "Training Ettin-68m Reranker with MSE"
description:
    Configuration for training an ettin-68m model with the MSE_mixedbread_large loss on cross_encoder.ettin_reranker_v1_data.

module: cross_encoders_training.experiment
# pre_experiment: pre_experiment
seed: 12 # To mimick the HF xp
nb_repetitions: 3
max_length: 1024

# Subsets of the ettin-reranker-v1-data dataset to exclude (by default empty, using all 39 subsets)
retriever: "naver/splade-v3-distilbert" #BM25
use_st_scorer: false # Use HFCrossScorer instead of STCrossEncoder
base: jhu-clsp/ettin-encoder-68m

preprocessing:
    requirements: duration=8h & cpu(cores=16, mem=10G)

indexation:
    batch_size: 128
    requirements: duration=20h & cpu(cores=8, mem=10G) & cuda(mem=24G)

validation:
    size: 500 # Use 500 topics for validation

# This set of hyperparameters follows: https://github.com/huggingface/sentence-transformers/blob/9f76b5790fa8f0175ccdc27e41f9ae348f557144/examples/training/ms_marco/train_cross-encoder-v2.py
learner:
    loss: MSE_mixedbread_large
    optimization:
        steps_per_epoch: 100
        max_epochs: 2000 #  x 128 x 100 = ~26M Samples < 145M in full dataset
        num_warmup_steps: 20000 # Follows the original setup
        weight_decay: 0.00
        lr: 3e-5 #tom aarsen value
        eps: 1.0e-8
    fabric:
        precision: bf16-mixed
    # sample_max: 2_000_000
    max_grad_norm: 1.0
    checkpoint_interval: 50
    validation_interval: 20
    validation_top_k: 100
    validation: nanobeir11
    requirements: duration=20h & cpu(cores=16, mem=10G) & cuda(mem=40G)

ettin_subset_exclude: []

retrieval:
    requirements: duration=20h & cpu(cores=16, mem=10G) & cuda(mem=20G)
    batch_size: 64
    k: 100

evaluation:
    beir13: false
    in_domain: true
    datasets:
        - arguana
        - touche
        - nfcorpus

    # nanobeir: true

#### Params that are grid searched
grid_search:
    learner.optimization.batch_size:
        values_list:
            - 64
            - 128
            # - infoNCE_Colbertv2Neg
            # - infoNCE_RankDistiLLM
