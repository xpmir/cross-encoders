id: eval_scorer_top100
title: cross_scorer_evaluation
description: Evaluation with separate max_len for query and doc,
  This ensure parity with Mice models that tokenize query and doc separately.

module: Evaluation.experiment
pre_experiment: pre_experiment
parent: ../_common.yaml
gpu: true

grid_search:
  config_dicts:
    - scorer_type: st_multivector
      scorer_id: lightonai/LateOn
    - scorer_type: st
      scorer_id: cross-encoder/ettin-reranker-400m-v1
    - scorer_type: st
      scorer_id: cross-encoder/ettin-reranker-150m-v1
    - scorer_type: st
      scorer_id: cross-encoder/ettin-reranker-68m-v1
    # - scorer_type: st
    #   scorer_id: cross-encoder/ettin-reranker-17m-v1
    # - scorer_type: st
    #   scorer_id: Qwen/Qwen3-Reranker-0.6B
    # - scorer_type: st
    #   scorer_id: cross-encoder/ms-marco-MiniLM-L12-v2
    # - scorer_type: st
    #   scorer_id: mixedbread-ai/mxbai-rerank-base-v2
    # - scorer_type: st
    #   scorer_id: xpmir/cross-encoder-MiniLM-L12-infoNCE
    # - scorer_type: st
    #   scorer_id: mixedbread-ai/mxbai-rerank-large-v2

retriever: naver/splade-v3-distilbert

evaluation:
  #just for debugging
  in_domain: true
  beir13: true
  beir13_decontaminated: true
  lotte: true
