id: debug_mice_v2_training
title: "Debugging Mice V2 training"
description:
    💡 Debug config for ModernBERT Mice V2 training using ettin-encoder-17m

module: MICE.experiments.micev2_training
export_trained_models: false
parent: ./_ettin68m.yaml


nb_repetitions: 2

# Smaller training, more validation, and more frequent checkpoints for debugging purposes
learner:
    loss: MSE_mixedbread_large
    optimization:
        steps_per_epoch: 100
        max_epochs: 150 #  x 128 x 100 = ~26M Samples < 145M in full dataset
        batch_size: 256 #is 256 in ettin-reranker-v1
    fabric:
        precision: bf16-mixed
    # sample_max: 2_000_000
    checkpoint_interval: 50
    validation_interval: 5
    requirements: duration=2h & cpu(cores=16) & cuda(mem=80G)

evaluation:
    all_datasets: false
    in_domain: true
    datasets:
        - nfcorpus
        - scifact
        - trec-covid
