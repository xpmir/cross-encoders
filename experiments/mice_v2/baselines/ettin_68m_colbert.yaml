id: baseline_ettin68m_colbert
title: "Training Ettin-68m Reranker with MSE"
description:
    Configuration for training an ettin-68m model with the MSE_mixedbread_large loss on cross_encoder.ettin_reranker_v1_data.

module: cross_encoders_training.experiment
parent: ../_common.yaml
nb_repetitions: 2

# This set of hyperparameters follows https://huggingface.co/blog/ettin-reranker
learner:
    optimization:
        max_epochs: 3000 # 5k x 256 x 100 = 128M < 143M in dataset
        num_warmup_steps: 20000 # Follows the original setup
        # Values from Ettin Rerankers: https://huggingface.co/blog/ettin-reranker
        batch_size: 256
        lr: 3e-5
        re_no_l2_regularization: [ '\.bias$', '(?i)norm' ]
    requirements: duration=20h & cpu(mem=10G) & cuda(mem=30G) * 2
    # requirements: duration=20h & cpu(cores=16, mem=10G) & cuda(mem=30G) * 2 # JZ

# Subsets of the ettin-reranker-v1-data dataset to exclude (by default empty, using all 39 subsets)
base: jhu-clsp/ettin-encoder-68m

#override _common.yaml
max_length: null
max_query_length: 32
max_doc_length: 512

evaluation: #default = Minified tests
    all_datasets: false
    in_domain: false
    beir13: false
    eval_checkpoint:
        - last


grid_search:
    config_dicts:
        - {scorer_type: stCrossEncoder, learner.optimization.lr: 3e-5}
        - {scorer_type: stMultiVectorEncoder, learner.optimization.lr: 1e-5}
