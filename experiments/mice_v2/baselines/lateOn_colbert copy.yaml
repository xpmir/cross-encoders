id: baseline_lateon_colbert
title: "Training LateOn Reranker with MSE"
description:
    Configuration for training a LateOn model with the MSE_mixedbread_large loss on cross_encoder.lateon_reranker_v1_data.

module: cross_encoders_training.experiment
parent: ../_common.yaml
nb_repetitions: 2

# This set of hyperparameters follows https://huggingface.co/blog/ettin-reranker
learner:
    optimization:
        max_epochs: 5000 # 5k x 256 x 100 = 128M < 143M in dataset
        num_warmup_steps: 20000 # Follows the original setup
        # Values from Ettin Rerankers: https://huggingface.co/blog/ettin-reranker
        batch_size: 256
        lr: 1e-5
        re_no_l2_regularization: [ '\.bias$', '(?i)norm' ]
    requirements: duration=2h & cpu(cores=16, mem=10G) & cuda(mem=50G) * 2

# Subsets of the ettin-reranker-v1-data dataset to exclude (by default empty, using all 39 subsets)
base: lightonai/LateOn-unsupervised
scorer_type: stMultiVectorEncoder


#override _common.yaml
max_length: null
max_query_length: 32
max_doc_length: 512

evaluation: #default = Minified tests
    all_datasets: false
    in_domain: false
    beir13: false
    eval_checkpoint:
        - last
