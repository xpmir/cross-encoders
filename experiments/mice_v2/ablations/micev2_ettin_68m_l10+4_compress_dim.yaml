id: train_micev2_ettin68m_l10+4_abl_compress_dim
title: "Mice-Ettin-68m Compression Dimension Ablation"
description:
    Ablation sweeping compress_dim x compress_init_option for the top interaction
    layers, to measure the accuracy/size trade-off of compressing the interaction
    stack and compare data-driven vs random initialization of the compressed weights.

module: MICE.experiments.micev2_training
parent: ../_ettin68m_abl.yaml
nb_repetitions: 1

top_layers_doc_ln: true
bottom_final_norm: false
top_final_norm: false
normalize_doc_embeds: true

grid_search:
    config_dicts:
        - { compress_dim: 1.0, compress_init_option: "seed" }
        - { compress_dim: 1.0, compress_init_option: "random" }
        - { compress_dim: 1.333333333, compress_init_option: "random" }
        - { compress_dim: 2.0, compress_init_option: "random" }
        - { compress_dim: 4.0, compress_init_option: "random" }
