id: eval_scorers_latency
title: cross_scorer_evaluation
description: Evaluation of MICE v2 Models

parent: ../_common.yaml
module: Evaluation.experiment
pre_experiment: pre_experiment

#First stage: splade-v3
retriever: naver/splade-v3-distilbert

scorer_type: stMultiVectorEncoder

max_query_length: 32
max_doc_length: 512

evaluation:
  #just for debugging
  in_domain: false
  beir13: false
  beir13_decontaminated: false
  datasets:
    - dbpedia_decontaminated


indexation:
  batch_size: 128
  requirements: duration=2h & cpu(cores=16, mem=20G) & cuda(mem=30G)

use_plaid: true
precompute_first_stage: false
include_recall_100: true

grid_search:
  config_dicts:
    - {scorer_id: "cross-encoder/ettin-reranker-150m-v1", scorer_type: stCrossEncoder}
    - {scorer_id: "VictorMorand/Colbert-ettin-150m-mxbread-pearson", scorer_type: stMultiVectorEncoder}
    - {scorer_id: "VictorMorand/Colbert-ettin-68m-mxbread-pearson", scorer_type: stMultiVectorEncoder}
    # - lightonai/LateOn
