id: debug_mice_training
title: "Debugging Mice training"
description:
    💡 this config load everything from core_base.yaml, and just overrides the base and learner.loss
    So that only ettin-150m is launched with infoNCE loss

module: MICE.experiments.mice_training
# pre_experiment: pre_experiment

seed: 12 # To mimick the HF xp
nb_repetitions: 1


preprocessing:
    requirements: duration=8h & cpu(cores=8)

indexation:
    batch_size: 128
    requirements: duration=20h & cpu(cores=4, mem=10G) & cuda(mem=40G)

validation:
    # Use 500 topics for validation
    size: 500

# This set of hyperparameters follows: https://github.com/huggingface/sentence-transformers/blob/9f76b5790fa8f0175ccdc27e41f9ae348f557144/examples/training/ms_marco/train_cross-encoder-v2.py
learner:
    optimization:
        steps_per_epoch: 100
        batch_size: 64
        max_epochs: 50 # Sum is 2_500_000. Multiplied by BS of 32, it gives 80M samples, which is a bit above the size of the dataset
        num_warmup_steps: 5000 # Follows the original setup
        weight_decay: 0.00
        lr: 1e-5
        eps: 1.0e-8
    fabric:
        precision: bf16-mixed
    # sample_max: 2_000_000
    max_grad_norm: 1.0
    checkpoint_interval: 25
    validation_interval: 25
    validation_top_k: 100
    validation: nanobeir11
    loss: marginMSE
    requirements: duration=12h & cpu(cores=4) & cuda(mem=20G)

retrieval:
    requirements: duration=20h & cuda(mem=20G)
    batch_size: 64
    k: 100

# evaluation:
#     # test_max_topics: 100
#     all_datasets: false
#     in_domain: false
#     datasets:
#         - arguana
#         - nfcorpus
#         # - fiqa

# plaid:
#     use_plaid: true
#     batch_size: 25_000
#     n_bits: 4
#     kmeans_niters: 4
#     buffer_size: 5000
#     compress_only: true

#MICE params
n_contextualization_layers: 4
n_interaction_layers: 3
bound_bottom_layers: false
# save_runs: true


#### Params that are grid searched
grid_search:

    base:
        values_list:
            - microsoft/MiniLM-L12-H384-uncased
            # - jhu-clsp/ettin-encoder-32m
            # - microsoft/MiniLM-L12-H384-uncased
    extra_attn_bias:
        values_list:
            - true
            - false
