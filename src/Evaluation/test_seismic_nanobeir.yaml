id: test_seismic_nanobeir
title: test_seismic_nanobeir
description: Test Seismic approximate search on NanoBEIR nfcorpus

module: Evaluation.experiment
pre_experiment: pre_experiment

gpu: false

retriever: naver/splade-v3-distilbert

seismic:
  enabled: [false, true]
  n_postings: 1000
  centroid_fraction: 0.1
  summary_energy: 0.4
  query_cut: 10
  heap_factor: 0.7

# preprocessing:
#   requirements: ""

indexation:
  requirements: ""
  batch_size: 32

retrieval:
  requirements: ""
  batch_size: 64
  k: 10

evaluation:
  test_max_topics: 10
  all_datasets: false
  datasets:
    - nano_nfcorpus
  in_domain: false
  beir13: false
  nanobeir: false
