id: debug_STCE_training
title: "Debugging STCrossEncoder Training"
description: Fine-tune a MiniLM-v2 model with a margin MSE loss on BM25 negatives while applying masking.

    Starts from the checkpoint > microsoft/MiniLM-L12-H384-uncased

module: cross_encoders_training.experiment
# pre_experiment: pre_experiment

gpu: true
seed: 12 # To mimick the HF xp
nb_repetitions: 1

# Subsets of the ettin-reranker-v1-data dataset to exclude (only keeping rerank_msmarco for debug speed)
ettin_subset_exclude:
  - agnews
  - altlex
  - amazon_qa
  - amazon_reviews
  - arxiv_title_abstract
  - beir_dbpedia
  - biorxiv_title_abstract
  - cc_news_en
  - cnn_dailymail
  - fw_edu
  - gooaq_qa
  - medrxiv_title_abstract
  - msmarco
  - mtp
  - npr
  - paq
  - quora
  - reddit
  - reddit_body_comment
  - rerank_fever
#   - rerank_msmarco
#   - rerank_squadv2
  - rerank_fiqa
  - rerank_hotpotqa
  - rerank_nq
  - rerank_trivia
  - s2orc_abstract_citation
  - s2orc_citation_titles
  - s2orc_title_abstract
  - stackexchange_body_body
  - stackexchange_duplicate_questions
  - stackexchange_qa
  - stackexchange_title_body
  - stackoverflow_title_body
  - wikianswers
  - wikihow
  - yahoo_answer
  - yahoo_qa
  - yahoo_question_body

preprocessing:
    requirements: duration=8h & cpu(cores=16, mem=10G)

indexation:
    batch_size: 128
    requirements: duration=20h & cpu(cores=8, mem=10G) & cuda(mem=24G)

validation:
    size: 500 # Use 500 topics for validation

retriever: "naver/splade-v3-distilbert" #BM25

base: jhu-clsp/ettin-encoder-68m
max_length: 1024

# This set of hyperparameters follows: https://github.com/huggingface/sentence-transformers/blob/9f76b5790fa8f0175ccdc27e41f9ae348f557144/examples/training/ms_marco/train_cross-encoder-v2.py
learner:
    optimization:
        steps_per_epoch: 100
        max_epochs: 400 # Sum is 2_500_000. Multiplied by BS of 32, it gives 80M samples, which is a bit above the size of the dataset
        num_warmup_steps: 5000 # Follows the original setup
        weight_decay: 0.00
        lr: 3e-5
        eps: 1.0e-8
    fabric:
        precision: bf16-mixed
    # sample_max: 2_000_000
    max_grad_norm: 1.0
    checkpoint_interval: 50
    validation_interval: 20
    validation_top_k: 100
    validation: nanobeir11
    requirements: duration=5h & cpu(cores=8) & cuda(mem=40G)

retrieval:
    requirements: duration=20h & cpu(cores=8) & cuda(mem=20G)
    batch_size: 64
    k: 100

evaluation:
    test_max_topics: 100
    beir13: false
    in_domain: true
    datasets:
        - arguana
        - touche
        - nfcorpus

    # nanobeir: true

#### Params that are grid searched
grid_search:
    learner.loss:
        values_list:
            - MSE_mixedbread_large
            # - marginMSE

    learner.optimization.batch_size:
        values_list:
            - 64
            - 128

    pref_attn_implementation:
        values_list:
            - flash_attention_2
            - sdpa
