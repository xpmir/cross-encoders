id: debug_mice_v2_l0reg
title: "Debugging Mice V2 training"
description:
    💡 Debug config for ModernBERT Mice V2 training using ettin-encoder-17m

module: MICE.experiments.micev2_training
parent: ../_ettin68m_abl.yaml
nb_repetitions: 1

base: cross-encoder/ettin-reranker-68m-v1

learner:
    requirements: duration=2h & cpu(cores=8, mem=10G) & cuda(mem=40G)


# Eval only on BEIR
eval_sparsity: true
evaluation: #default = Minified tests
    eval_checkpoint: "last"
    all_datasets: false
    in_domain: false
    beir13: false

#Utility settings for pruning
utility_pred: true
hard_prune_threshold: 0.1
# Regularization settings for pruning
reg_target: u
l2_reg: false
phase2_training: true
phase2_max_epochs: 1000
eval_phase_1: false

# Utility schedule - Best settings from xp_pareto_v1
temp_schedule: exp
temp_start: 1.0
utility_bias: 3.0
temp_end: 0.1 # not ok with new LR = 7e-5, but ok with LR = 3e-5 (v1)



grid_search:
    config_dicts:
        # Hard Concrete tests
        - {lambda_reg: 1.0, gate_target: v, use_hard_concrete: true, phase2_training: false, temp_start: 2.0, utility_bias: 3.0} # single-phase hard concrete L0 (temp 2.0 test)
        - {lambda_reg: 1.0, gate_target: v, use_hard_concrete: true, phase2_training: false, temp_start: 0.67, utility_bias: 0.0} # Louizos et al: beta=2/3, bias=0.0, lambda=1.0
        # Two phase soft gating tests
        - {lambda_reg: 0.0, gate_target: h, use_hard_concrete: false, phase2_training: true, temp_start: 1.0, utility_bias: 3.0} # baseline - no pruning
        - {lambda_reg: 0.1, gate_target: h, use_hard_concrete: false, phase2_training: true, temp_start: 1.0, utility_bias: 3.0} # 2-phase soft gate h
        - {lambda_reg: 0.1, gate_target: v, use_hard_concrete: false, phase2_training: true, temp_start: 1.0, utility_bias: 3.0} # 2-phase value-only gate v
