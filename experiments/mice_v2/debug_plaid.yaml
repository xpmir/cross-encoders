id: debug_plaid_ettin68m_l10+4
title: "Mice-Ettin-68m Training + Plaid evaluation"
description:
    Take one trained Mice-Ettin-68m model, and evaluate it with Plaid indexing and retrieval on 3 small datasets.

module: MICE.experiments.micev2_training
parent: ./_debug_mice_v2.yaml
nb_repetitions: 1 # keep only one seed over the 2 seeds of the parent experiment


# Smaller training, more validation, and more frequent checkpoints for debugging purposes
learner:
    optimization:
        max_epochs: 400 #  x


normalize_doc_embeds:
    values_list: [true, false]

plaid:
    use_plaid: true

evaluation: # Build Plaid index and Evaluate only on 3 small datasets
    eval_checkpoint: "last"
    all_datasets: false
    in_domain: false
    beir13: false
    datasets:
        - nfcorpus
        - arguana
        - scifact

retrieval:
    requirements: duration=3h & cpu(cores=16) & cuda(mem=20G)


#override just for this experiment so spare compute (doesn't change much)
max_length: 1024
max_query_length: null
max_doc_length: null
