id: eval_scorers_latency
title: cross_scorer_evaluation
description: Evaluation of MICE v2 Models

parent: ../_common.yaml
module: Evaluation.experiment
pre_experiment: pre_experiment

#First stage: splade-v3
retriever: naver/splade-v3-distilbert

scorer_type: stMultiVectorEncoder

max_query_length: 32
max_doc_length: 512

evaluation:
  #just for debugging
  in_domain: false
  beir13: false
  beir13_decontaminated: false
  datasets:
    - dbpedia_decontaminated


indexation:
  batch_size: 128
  requirements: duration=2h & cpu(cores=16, mem=20G) & cuda(mem=30G)

retrieval:
  batch_size: 256
  chunk_size: null #retrieve all candidates in one go before Stage 2 reranking
  in_memory: true #load the sparse retriever index in memory instead of memory-mapping
  requirements: duration=2h & cpu(cores=16, mem=20G) & cuda(mem=30G)

use_plaid: true
precompute_first_stage: false
include_recall_100: true


grid_search:
  config_dicts:
    - {plaid.n_bits: 2, scorer_id: "cross-encoder/ettin-reranker-150m-v1", scorer_type: stCrossEncoder}
    - {plaid.n_bits: 2, scorer_id: "VictorMorand/Colbert-ettin-150m-mxbread-pearson", scorer_type: stMultiVectorEncoder}
    - {plaid.n_bits: 2, scorer_id: "VictorMorand/Colbert-ettin-68m-mxbread-pearson", scorer_type: stMultiVectorEncoder}
    - {plaid.n_bits: 4, scorer_id: "train_micev2_ettin150m_l12+4_v3_plaid_128", scorer_type: miceV2}
    - {plaid.n_bits: 4, scorer_id: "train_micev2_ettin68m_l10+4_v3_plaid_128", scorer_type: miceV2}
    # - lightonai/LateOn
